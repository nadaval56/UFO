name: Scrape war.gov & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly poll for new releases.
    - cron: "0 8 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + write token so the scrape step can push
          # the refreshed manifest back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape live file list from war.gov
        id: scrape
        continue-on-error: true
        run: python scripts/build_manifest.py

      - name: Commit refreshed manifest if changed
        if: steps.scrape.outcome == 'success'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/manifest.json; then
            git add data/manifest.json
            git commit -m "ci: refresh manifest from war.gov [skip ci]"
            # Don't push debug dumps; they're gitignored.
            git push origin HEAD:main || echo "push failed — manifest changes will retry next run"
          else
            echo "manifest unchanged — no commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
