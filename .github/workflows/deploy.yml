name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Note on data refresh: war.gov is protected by Akamai WAF which 403s
# every GitHub-hosted IP, so the manifest cannot be scraped from CI.
# The manifest is built in the user's browser (scripts/browser_scrape.js
# pasted into DevTools console on https://www.war.gov/UFO/) and committed
# to data/manifest.json directly. This workflow then just ships the static
# site.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # indexnow.py diffs HEAD~1..HEAD

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing & co. which pages changed (scripts/indexnow.py). A manual
      # run of this workflow resubmits every sitemap URL. Never fails the
      # deploy: the site is already live by this point.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          sleep 30
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/indexnow.py --all
          else
            python3 scripts/indexnow.py
          fi
